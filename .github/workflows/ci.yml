name: CI/CD Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make libreadline-dev fuse3 libfuse3-dev
        
    - name: Build kubsh
      run: make
      
    - name: Create DEB package
      run: make deb
      
    - name: Run tests in Docker
      run: |
        docker pull tyvik/kubsh_test:master
        docker run --rm \
          -v $(pwd)/kubsh.deb:/mnt/kubsh.deb \
          --device /dev/fuse \
          --cap-add SYS_ADMIN \
          tyvik/kubsh_test:master
- name: Run professor's tests
  run: |
    echo "=== Professor's test suite ==="
    docker run --rm \
      -v $(pwd):/app \
      -w /app \
      tyvik/kubsh_test:master \
      /bin/bash -c "make || make all || echo 'Build command not found'; \
                    if [ -f /app/kubsh ]; then \
                      echo 'Testing kubsh...'; \
                      echo '\\q' | timeout 2 /app/kubsh && echo '✓ Basic execution OK'; \
                    fi"
